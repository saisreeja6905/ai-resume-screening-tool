{% extends "layout/base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="display-1 text-primary fw-bold">404</div>
        <h2 class="h4 mt-3 mb-2">Resource Not Found</h2>
        <p class="text-muted mb-4">The page, resume, or record you requested does not exist or has been moved.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary rounded-pill px-4">
            <i class="fa-solid fa-house me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
