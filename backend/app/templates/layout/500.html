{% extends "layout/base.html" %}

{% block title %}Server Error (500){% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="display-1 text-danger fw-bold">500</div>
        <h2 class="h4 mt-3 mb-2">Unexpected Server Error</h2>
        <p class="text-muted mb-4">An error occurred while processing your request. Our system logs have recorded this incident.</p>
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-primary rounded-pill px-4">
            <i class="fa-solid fa-house me-1"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
