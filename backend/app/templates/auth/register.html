{% extends "layout/base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <div class="card-header bg-dark-navy text-white text-center py-4 border-0">
                <div class="brand-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.4rem;">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h4 class="fw-bold mb-0">Join AntiGravity AI</h4>
                <p class="text-white-50 small mb-0">Recruiter and Talent Screening Platform</p>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="row g-2 mb-3">
                        <div class="col-sm-6">
                            <label for="first_name" class="form-label small fw-medium">First Name</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" placeholder="John" required>
                        </div>
                        <div class="col-sm-6">
                            <label for="last_name" class="form-label small fw-medium">Last Name</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" placeholder="Doe">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label small fw-medium">Username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="johndoe" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label small fw-medium">Work Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="john.doe@company.com" required>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-sm-6">
                            <label for="password" class="form-label small fw-medium">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Min. 6 chars" required minlength="6">
                        </div>
                        <div class="col-sm-6">
                            <label for="confirm_password" class="form-label small fw-medium">Confirm Password</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-type password" required minlength="6">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="role" class="form-label small fw-medium">Platform Role</label>
                        <select class="form-select" id="role" name="role">
                            <option value="recruiter" selected>Recruiter / Talent Specialist</option>
                            <option value="admin">Talent Operations Administrator</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary-accent text-white w-100 py-2 rounded-3 fw-medium shadow-sm">
                        <i class="fa-solid fa-check me-2"></i> Create Account
                    </button>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <p class="text-muted small mb-0">Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary text-decoration-none fw-semibold">Sign in here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
